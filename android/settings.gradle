pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

try {
    def processEnv = Class.forName("java.lang.ProcessEnvironment")
    def field = processEnv.getDeclaredField("theCaseInsensitiveEnvironment")
    field.setAccessible(true)
    def map = field.get(null)
    map.remove("ANDROID_PREFS_ROOT")
} catch (ignored) {
    try {
        def env = System.getenv()
        def field = env.getClass().getDeclaredField("m")
        field.setAccessible(true)
        def map = field.get(env)
        map.remove("ANDROID_PREFS_ROOT")
    } catch (ignored2) {}
}

include ":app"
